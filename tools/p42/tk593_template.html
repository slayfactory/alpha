<style>
:root{--bg:#fafafa;--fg:#09090b;--muted:#f4f4f5;--mfg:#71717a;--border:#e4e4e7;--accent:#2563eb;--z300:#d4d4d8;--z400:#a1a1aa;--z500:#71717a;--z600:#52525b;--z700:#3f3f46;--r:12px;

/* TK-742: тёмная тема — класс dark на <html> (переключатель в верхней строке, выбор в localStorage p42-theme); цвета страницы и вкладки «Сделки» берутся из этих переменных */
html.dark{--bg:#09090b;--fg:#fafafa;--muted:#1f1f23;--mfg:#a1a1aa;--border:#27272a;--accent:#3b82f6;--z300:#3f3f46;--z400:#71717a;--z500:#a1a1aa;--z600:#d4d4d8;--z700:#e4e4e7;
--card:#111113;--hover:#1f1f23;--hi:#13213f;--pin:#3b0f22;--grid:#1c1c20;--axis:#3f3f46;--dash:#71717a;--onfg:#09090b;--bar:rgba(9,9,11,.92);--bar2:rgba(9,9,11,.96);--tabsel:#3f3f46;--sh1:rgba(0,0,0,.4);--sh2:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 96px}
.wrap.wide{max-width:none}
.bar{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);margin:0 -24px;padding:10px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--muted);padding:4px;border-radius:9px}
.tabs button{border:0;background:transparent;padding:6px 18px;border-radius:6px;font:500 13px inherit;color:var(--mfg);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--tabsel);color:var(--fg);box-shadow:0 1px 2px var(--sh2)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font:500 12.5px inherit;color:var(--mfg);cursor:pointer}
.nav button:hover{background:var(--muted);color:var(--fg)}
section{margin-top:44px;scroll-margin-top:70px}
h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px var(--sh1);min-width:0}
.card-h{padding:14px 20px 0;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-h b{font-size:14px;font-weight:600}
.card-h span{color:var(--mfg);font-size:12px}
.card-b{padding:10px 20px 18px}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--mfg);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;white-space:nowrap}

.muted{color:var(--mfg)}
.small{font-size:12px}

.badge.ok{background:var(--accent);border-color:var(--accent);color:#fff}

.legend span{display:inline-flex;align-items:center;gap:6px}

svg text.k{fill:var(--fg)}

#tip .t{font-weight:600;margin-bottom:2px}

.fan-pin .sw{display:inline-block;width:18px;border-top:3px solid}

.fan-s1 input{min-width:0;width:100%;accent-color:var(--fg)}

.fan-row{margin:8px 0 0}
.fan-cnt,.fan-msg{font-size:13px;color:var(--z600);font-variant-numeric:tabular-nums}
.fan-msg{margin:16px 0}
.fan-cv{position:relative;margin-top:6px}
.fan-cv canvas{position:absolute;left:0;top:0;width:100%}
.fan-cv canvas[data-fan=over]{cursor:crosshair}
.fan-t tbody tr{cursor:pointer}
.fan-t th[data-sort]{cursor:pointer;user-select:none}

.eq-card{margin-top:20px}
.eq-card .card-b{padding:12px 20px 18px}
.eqt{margin-top:12px}
.eqt th,.eqt td{padding:8px 10px;white-space:nowrap}
.eqt td:first-child{min-width:0}
.eqt[data-wtable] td:first-child{white-space:normal;min-width:190px}
.eqt th{white-space:normal;vertical-align:bottom;max-width:120px}
.eqt .sw{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:8px}

.eqt,.eqt tbody{display:block}
.eqt thead{display:none}

@media(max-width:640px){.fan-t thead{display:block}.fan-t thead tr{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 0 8px}.fan-t thead th:first-child{display:none}.fan-t th{padding:0;font-size:12px;max-width:none}}      /* заголовки столбцов остаются — по ним задаётся порядок */
.prog{padding:28px 0 8px}
.prog-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.prog-h h2{font-size:20px;font-weight:650;letter-spacing:-.02em}
/* TK-606: вкладка «Признаки» */
.ft-bar .nav{flex-wrap:wrap}
section.ft-set{margin-top:22px}
.ft-set .card-h{flex-wrap:wrap;align-items:center;padding-top:16px}
.ft-set .card-h b{font-size:15px}
.ft td.nm code{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--muted);padding:1px 6px;border-radius:4px;color:var(--z700)}
.ft-tw{overflow-x:auto}
.ft th,.ft td{padding:8px 12px;vertical-align:top}
.ft td:first-child{min-width:0}
.ft{table-layout:fixed}
.ft td.nm{overflow-wrap:anywhere}
.ft td.nm code{font-size:12.5px;color:var(--fg);font-weight:600}
.ft td.what{font-size:13px}
.ft td.no{color:var(--mfg);font-variant-numeric:tabular-nums;cursor:pointer}
.ft tr.hit td{background:var(--hi)}
.ft tr.hit td.no{color:var(--accent);font-weight:650;box-shadow:inset 3px 0 0 var(--accent)}
.ft td.base,.ft td.srch{font-size:13px;overflow-wrap:anywhere}
.ft td.rel,.ft td.st{font-size:13px;overflow-wrap:anywhere}
.ft td.rel a{color:var(--accent);text-decoration:none;cursor:pointer;font-variant-numeric:tabular-nums}
.ft td.rel a:hover{text-decoration:underline}
.ft td.st{color:var(--mfg)}
.ft tr.grp td{background:var(--muted);border-bottom:0;padding:6px 12px;font-weight:600;font-size:12.5px}
.ft tr.grp+tr td{border-top:0}
@media(max-width:640px){
.ft-set .card-b{padding:10px 12px 14px}
.ft-set .card-h{padding:14px 12px 0}
.ft-bar .nav{flex-wrap:nowrap;overflow-x:auto;max-width:100%}
.ft-bar .nav button{white-space:nowrap}
}
@media(max-width:820px){
.ft-tw{overflow-x:visible}
.ft{table-layout:auto}
.ft,.ft tbody{display:block}
.ft thead{display:none}
.ft tr{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;padding:10px 0;border-bottom:1px solid var(--border)}
.ft td.what,.ft td.base,.ft td.srch,.ft td.rel,.ft td.st{grid-column:1/-1}
.ft td.base:empty,.ft td.srch:empty,.ft td.rel:empty,.ft td.st:empty{display:none}
.ft tr.hit td.no{box-shadow:none}
.ft tr:last-child{border-bottom:0}
.ft td,.ft td:first-child{padding:0;border:0;min-width:0;max-width:none;width:auto;white-space:normal}
.ft td.base::before{content:"База: ";color:var(--mfg)}
.ft td.srch::before{content:"Перебор: ";color:var(--mfg)}
.ft td.rel::before{content:"Связан с №: ";color:var(--mfg)}
.ft td.st::before{content:"Статус: ";color:var(--mfg)}
.ft tr.grp{display:block;padding:0;border:0;margin-top:6px}
.ft tr.grp td{padding:6px 10px;border-radius:6px}
}
.badge.fail{background:var(--fg);border-color:var(--fg);color:var(--onfg)}
.tabs[hidden]{display:none}
/* TK-742: переключатель светлой / тёмной темы */
#theme-toggle{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--mfg);cursor:pointer;flex:none}
#theme-toggle:hover{color:var(--fg);background:var(--hover)}
#theme-toggle svg{width:16px;height:16px;overflow:visible}
html:not(.dark) #theme-toggle .i-sun,html.dark #theme-toggle .i-moon{display:none}
/* TK-741: вкладка «Сделки» */
.eqt.trs tbody tr,.eqt.trt tbody tr{cursor:pointer}
.eqt tr.sel{background:var(--hi)}
.eqt.trs td[data-f=name]{white-space:normal;min-width:260px}
.eqt.trs td[data-f=name] .muted{white-space:normal}
.trt th[data-sort]{cursor:pointer;user-select:none}
.tr-x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--z500);padding:0 4px;margin-left:auto}
#tr-detail .card-h{flex-wrap:wrap}
.tr-feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 16px;margin-top:6px}
.tr-feats div{display:flex;flex-direction:column}
.tr-fh{margin-top:12px}
.tr-note{margin-top:6px}
@media(max-width:640px){.trt thead{display:block}.trt thead tr{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 0 8px}.trt th{padding:0;font-size:12px;border:0}.trt td.tf{display:none}.tr-feats{grid-template-columns:1fr 1fr}}      /* TK-741: на узком экране заголовки столбцов остаются — по ним задаётся порядок; числа сетапа — в карточке сделки */
</style>

<div class="toptabs"><div class="toptabs-in"><span class="brand">П-42 · CatBoost</span><div class="tabs" id="toptabs" role="tablist"></div><button id="theme-toggle" type="button" aria-label="Тема: светлая / тёмная" title="Светлая / тёмная тема"><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div></div>

      <div class="eq-h"><h2>Эквити</h2><span class="muted small" id="eq-sub">после комиссий, без фандинга · 500 $ на сделку · 01.07–13.11.2026</span></div>
      <div class="eq-ctls"><div class="tabs eq-ctl" id="eq-views" role="tablist"></div><div class="tabs eq-ctl" id="eq-tabs" role="tablist"></div></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const MINUS = '−';

const el = (t, a = {}, kids = []) => {
  const e = document.createElementNS(NS, t);
  for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]);
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c != null && e.append(c));
  return e;
};
const h = (t, a = {}, kids = []) => {
  const e = document.createElement(t);
  for (const k in a) if (a[k] != null) { if (k === 'class') e.className = a[k]; else if (k === 'html') e.innerHTML = a[k]; else e.setAttribute(k, a[k]); }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c != null && e.append(c));
  return e;
};
const sc = (d0, d1, r0, r1) => v => r0 + (v - d0) / (d1 - d0) * (r1 - r0);
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();      // TK-742: цвет темы для холстов (SVG берёт var(--…) сам)
function num(v, d = 3, sign = false) {
  if (v == null || v !== v) return '—';
  const s = Math.abs(v).toFixed(d).replace('.', ',');
  const z = +s.replace(',', '.') === 0;
  return (v < 0 && !z ? MINUS : (sign && !z ? '+' : '')) + s;
}
const ints = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function ticks(lo, hi, n = 5) {
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), nm = raw / mag;
  const step = (nm < 1.5 ? 1 : nm < 3 ? 2 : nm < 7 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-9; v += step) out.push(+v.toPrecision(12));
  return out;
}
const rng = (a, pad = 0.06) => { let lo = Math.min(...a), hi = Math.max(...a); const p = (hi - lo) * pad || 0.01; return [lo - p, hi + p]; };

// ── tooltip
const tip = document.getElementById('tip');
function moveTip(ev) {
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  x = Math.max(8, x); y = Math.max(8, y);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

// ── plot frame
function plot(o) {
  const w = o.w || 540, hh = o.h || 280, m = Object.assign({l: 46, r: 12, t: 18, b: 30}, o.m);
  const svg = el('svg', {viewBox: `0 0 ${w} ${hh}`, width: '100%', role: 'img', 'data-chart': o.id || null});
  const X = sc(o.xd[0], o.xd[1], m.l, w - m.r), Y = sc(o.yd[0], o.yd[1], hh - m.b, m.t);
  (o.yt || ticks(o.yd[0], o.yd[1], 5)).forEach(v => {
    svg.append(el('line', {x1: m.l, x2: w - m.r, y1: Y(v), y2: Y(v), stroke: 'var(--grid)'}));
    svg.append(el('text', {x: m.l - 7, y: Y(v) + 3.5, 'text-anchor': 'end'}, (o.yf || String)(v)));
  });
  (o.xt || ticks(o.xd[0], o.xd[1], 5)).forEach(v => svg.append(el('text', {x: X(v), y: hh - m.b + 15, 'text-anchor': 'middle'}, (o.xf || String)(v))));
  svg.append(el('line', {x1: m.l, x2: w - m.r, y1: hh - m.b, y2: hh - m.b, stroke: 'var(--axis)'}));
  if (o.ylab) svg.append(el('text', {x: 0, y: 9}, o.ylab));
  if (o.xlab) svg.append(el('text', {x: w - m.r, y: hh - 2, 'text-anchor': 'end'}, o.xlab));
  return {svg, X, Y, w, h: hh, m};
}
function legend(items) {
  return h('div', {class: 'legend'}, items.map(([sw, label]) => h('span', {}, [sw, label])));
}
function swLine(c, w = 2, d = null) { return el('svg', {width: 22, height: 10, viewBox: '0 0 22 10'}, [el('line', {x1: 0, x2: 22, y1: 5, y2: 5, stroke: c, 'stroke-width': w, 'stroke-dasharray': d})]); }

// ── эквити
const EQ_SIDES = [['short', 'Шорт'], ['long', 'Лонг'], ['both', 'Шорт + лонг']];
const pad2 = n => String(n).padStart(2, '0');

  // TK-682: «Связан с №» — номера-ссылки на строки (в том числе в других наборах); статус — только у набора, где он есть
  if (cols.rel) tds.push(h('td', {class: 'rel', 'data-f': 'rel'}, (f.rel || []).flatMap((k, i) => { const a = h('a', {'data-rel': k, href: `#features/${FT_BY_N.get(k)}/${k}`}, String(k)); a.onclick = ev => { ev.preventDefault(); ST.ft = FT_BY_N.get(k); ST.fn = k; setHash(); ftGo(); }; return i ? [', ', a] : [a]; })));
  if (cols.st) tds.push(h('td', {class: 'st', 'data-f': 'st'}, f.st || ''));
  return h('tr', {'data-feature': f.name, 'data-n': f.n, id: 'ft-n-' + f.n}, tds);
}
function ftCard(s) {
  const feats = s.groups.flatMap(g => g.features);
  // колонка без единого значения в наборе не рисуется
  const cols = {base: feats.some(f => f.base !== '—'), search: feats.some(f => f.search !== 'нет'), rel: feats.some(f => f.rel), st: feats.some(f => f.st)};
  const sec = h('section', {class: 'ft-set', id: 'ft-' + s.id, 'data-set': s.id});
  const card = h('div', {class: 'card'});
  card.append(h('div', {class: 'card-h'}, [h('b', {}, s.title)]));
  const b = h('div', {class: 'card-b'});
  const tb = h('table', {class: 'ft'});
  tb.append(h('colgroup', {}, [h('col', {style: 'width:56px'}), h('col', {style: 'width:130px'}), h('col'), ...(cols.base ? [h('col', {style: 'width:130px'})] : []), ...(cols.search ? [h('col', {style: 'width:200px'})] : []), ...(cols.rel ? [h('col', {style: 'width:140px'})] : []), ...(cols.st ? [h('col', {style: 'width:130px'})] : [])]));
  tb.append(h('thead', {}, h('tr', {}, [h('th', {}, '№'), h('th', {}, 'Признак'), h('th', {}, 'Что значит'), ...(cols.base ? [h('th', {}, 'База')] : []), ...(cols.search ? [h('th', {}, 'Перебор')] : []), ...(cols.rel ? [h('th', {}, 'Связан с №')] : []), ...(cols.st ? [h('th', {}, 'Статус')] : [])])));
  const body = h('tbody');
  s.groups.forEach(g => { if (g.title) body.append(h('tr', {class: 'grp'}, h('td', {colspan: 3 + cols.base + cols.search + cols.rel + cols.st}, g.title))); g.features.forEach(f => body.append(ftRow(f, s.id, cols))); });
  tb.append(body);
  b.append(h('div', {class: 'ft-tw'}, tb));
  card.append(b); sec.append(card);
  return sec;
}
function renderFeatures() {
  const root = document.getElementById('features');
  if (root.childElementCount) return;
  root.append(h('div', {class: 'prog-h'}, [h('h2', {}, 'Признаки'), h('span', {class: 'muted small'}, `${ftTotal} признаков · ${FEAT.sets.length} наборов · ${FEAT.updated}`)]));
  const nav = h('div', {class: 'nav'}, FEAT.sets.map(s => { const b = h('button', {'data-go': s.id}, s.short); b.onclick = () => { ST.ft = s.id; ST.fn = null; setHash(); ftGo(); }; return b; }));
  root.append(h('div', {class: 'bar ft-bar'}, nav));
  FEAT.sets.forEach(s => root.append(ftCard(s)));
}

/*__FANJS__*/
/*__TRADESJS__*/
// ── вкладки верхнего уровня: хеш #equity[/short|long|both[/<лонг>/<шорт>]] (TK-684: id варианта, токен клетки веера или «-») | #equity/fan/<short|long>/<параметры веера> (+ /f=<избранное через точку>) | #features[/<набор>[/<№>]]; всё прочее — «Эквити»
const TABS = [['equity', 'Эквити'], ['trades', 'Сделки'], ['features', 'Признаки']];
const ST = {tab: 'equity', ft: null, fn: null, eq: 'short', view: 'var', vl: V.default.long, vs: V.default.short, fan: FAN_DEF(), fav: []};
function parseHash() {
  const [a, b, c, d] = location.hash.replace(/^#/, '').split('/');
  ST.tab = TABS.some(t => t[0] === a) ? a : 'equity';
  ST.ft = a === 'features' && FEAT.sets.some(s => s.id === b) ? b : null;
  if (ST.tab === 'trades') trParse(b, c, d);      // TK-741: #trades/<период: main|JAN|N1|all>/<кластер, 0 — все>[/<№ сделки>]
  ST.fn = ST.ft && FT_BY_N.get(+c) === ST.ft ? +c : null;      // TK-678: #features/<набор>/<№> — строка признака
  // TK-684: прежние ссылки (#equity/<сторона>/where|bases|shape|curve|comp, #live, #progress, #model) открывают «Варианты» с базами
  const eqv = a === 'equity', seg = location.hash.split('/'), fv = eqv && seg.find(x => x.startsWith('f='));
  if (eqv) ST.fav = fv ? [...new Set(fv.slice(2).split('.').filter(x => FAN_TOK.test(x)))] : [];
  ST.view = eqv && b === 'fan' ? 'fan' : 'var';
  if (ST.view === 'fan') { ST.eq = c === 'long' ? 'long' : 'short'; ST.fan = fanParse(d && !d.startsWith('f=') ? d : ''); return; }
  const pick = (x, s) => x === '-' ? null : (V_BY.has(x) && V_BY.get(x).side === s) || (FAN_TOK.test(x || '') && x[0] === (s === 'long' ? 'L' : 'S')) ? x : V.default[s];
  ST.eq = eqv && EQ_SIDES.some(s => s[0] === b) ? b : 'short';
  ST.vl = pick(eqv ? c : null, 'long'); ST.vs = pick(eqv ? d : null, 'short');
}
function setHash() {
  const eq = ST.view === 'fan' ? '/fan/' + ST.eq + '/' + fanHash() : '/' + ST.eq + '/' + (ST.vl || '-') + '/' + (ST.vs || '-');
  history.replaceState(null, '', '#' + ST.tab + (ST.tab === 'equity' ? eq + (ST.fav.length ? '/f=' + ST.fav.join('.') : '') : ST.tab === 'features' && ST.ft ? '/' + ST.ft + (ST.fn ? '/' + ST.fn : '') : ST.tab === 'trades' ? trHash() : ''));
}
function route() {
  TABS.forEach(([k]) => { document.getElementById('pane-' + k).hidden = k !== ST.tab; });
  document.querySelector('.wrap').classList.toggle('wide', ST.tab === 'equity' || ST.tab === 'trades');      // «Эквити» — на всю ширину окна (боковые поля те же)
  document.querySelectorAll('#toptabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === ST.tab));
  if (ST.tab === 'equity') renderEquity();
  if (ST.tab === 'trades') renderTrades();
  if (ST.tab === 'features') { renderFeatures(); if (ST.ft) setTimeout(ftGo, 0); }
  setHash();
}
function goTab(k) { ST.tab = k; window.scrollTo(0, 0); route(); }
function initTabs() {
  const box = document.getElementById('toptabs');
  TABS.forEach(([k, t]) => { const b = h('button', {role: 'tab', 'data-tab': k, 'aria-selected': 'false'}, t); b.onclick = () => goTab(k); box.append(b); });
  parseHash();
  route();
  window.addEventListener('hashchange', () => { parseHash(); route(); });
  let rt, lastW = innerWidth; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (innerWidth !== lastW) { lastW = innerWidth; if (ST.tab === 'equity') renderEquity(); if (ST.tab === 'trades') renderTrades(); } }, 150); });
}

// TK-742: светлая / тёмная тема — класс dark на <html>; ранняя установка — скрипт в <head>; выбор запоминается в localStorage (p42-theme), по умолчанию тёмная
function initTheme() {
  const b = document.getElementById('theme-toggle');
  b.onclick = () => {
    const t = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
    document.documentElement.classList.toggle('dark', t === 'dark');
    try { localStorage.setItem('p42-theme', t); } catch (e) { /* без localStorage — только на этот сеанс */ }
    if (ST.tab === 'equity') renderEquity();      // холсты и SVG «Эквити» несут цвета темы — перерисовка
  };
}

function init() {
  initTheme();
  initEquity();
  initTabs();
  setTimeout(() => trAssets().catch(() => {}), 800);      // TK-742: приложение «Сделки» подгружается заранее — вкладка открывается сразу
}
init();
</script>
