[package]
name = "alpha"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
chrono = "0.4"
# zdict_builder — только ради обучения словаря в examples/dict_probe.rs (замер 2026-09-15:
# словарь отклонён, 2-3 %); на работу коллектора фича не влияет и может быть снята.
zstd = { version = "0.14", features = ["zdict_builder"] }
# live тянет iceoryx2 и tokio крейта; он понадобится на шаге живого бота, не сейчас.
hftbacktest = { version = "0.9.4", default-features = false, features = ["backtest"] }
# G-022 (турбо-коллектор): свой путь connect→TLS→WebSocket поверх нашего сокета (RTT рукопожатия, Recv-Q); версии те же, что у tokio-tungstenite.
tungstenite = "0.30"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
bytes = "1"
libc = "0.2"
# G-022 BingX: все кадры биржи — двоичные gzip; свой разбор заголовка + разжатие «сырым» deflate с переиспользуемым состоянием (collector/gzip.rs).
flate2 = "1"
# collector-perf: разжатие gzip-кадров BingX libdeflate (одним вызовом, CRC/длина проверяет библиотека); flate2 остаётся для сжатия в проверках и замерах. Он же — разжатие zip в процессе (store-fill, TK-607) вместо внешнего `unzip -p`.
libdeflater = "1"
# TK-580: CRC32 кадра на быстром пути мелких gzip-кадров (`collector/inflate.rs`); крейт уже в дереве через flate2.
crc32fast = "1"
# Decision 12: подпись приватных запросов Bybit. Ключи только из переменных окружения.
hmac = "0.13"
sha2 = "0.11"
# TK-051 Г1: глобальный аллокатор под флагом; без флага — прежний счётчик на System.
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
rdtsc-prof = ["hftbacktest/rdtsc-prof"]
mimalloc = ["dep:mimalloc"]
# R2 (TK-065): механики Г-87…Г-119; боевой PGO-бинарник без неё, исследовательский с ней.
r2 = []
# Проверки ядра коллектора на реакторе: `ShardOpts::new` берёт общий реактор процесса (весь набор тестов шардов идёт через него).
test-reactor = []

[dev-dependencies]
tempfile = "3"

# TK-706: профиль бинаря пробоя (`breakout tick`): fat LTO + один модуль кодогенерации + `panic = "abort"`. Замер на H1 (3 + 3 вперемешку, `perf stat`):
# LTO с abort — 71,3e9 циклов; LTO без abort — 91,6e9 (+29 %): выигрыш даёт связка, LTO без abort базу не обгоняет. Хеш дерева вывода тот же (docs/findings/p42-engine-speedup-2026-11-25.md §3.1).
# Бинарь этого профиля — ТОЛЬКО для `breakout tick`: коллекторы (`collector/runner.rs`, `shard.rs` терпят упавший поток через `join`) собираются профилем `release` и этим бинарём не запускаются.
# Сборка: `cargo build --profile p42 --bin alpha` (бинарь — `target/p42/alpha`).
[profile.p42]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# Локальная копия крейта hftbacktest 0.9.4 с одним исправлением
# (`PartialFillExchange`: нога, исполненная ровно до нуля, оставалась в карте биржи
# и роняла прогон `InvalidOrderStatus` при следующей сделке по той же цене) —
# без неё модель очереди по объёму (`--queue-model prob:<n>`, F3/F8/F10) на живых
# сутках падает. Разбор и воспроизведение — docs/findings/hftbacktest-partialfill-fix-2026-09-20.md.
[patch.crates-io]
hftbacktest = { path = "vendor/hftbacktest" }
